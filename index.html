<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>SNR TRADE - Progress Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        base: '#000000',     
                        surface: '#0a0a0a',  
                        surfaceHover: '#171717', 
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; color: #ffffff; -webkit-font-smoothing: antialiased; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: linear-gradient(145deg, rgba(20,20,20,0.8) 0%, rgba(10,10,10,0.4) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="min-h-screen pb-16 pt-8">

    <div class="max-w-2xl mx-auto px-5">
        
        <!-- Headline Section -->
        <div class="mb-8 text-center sm:text-left">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface border border-zinc-800 text-xs font-semibold text-zinc-400 mb-4">
                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                LIVE TRACKING
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2 text-white">
                Progres Call SNR Trade
            </h1>
            <p class="text-zinc-500 text-sm">Pantau terus hasil setup, win rate, dan pertumbuhan portofolio secara transparan.</p>
        </div>

        <!-- Time Filters (Rata Tengah Sempurna) -->
        <div class="flex justify-center gap-2 overflow-x-auto pb-2 mb-6 hide-scrollbar" id="timeFilters">
            <button onclick="updateData('7d')" class="filter-btn active px-5 py-2 rounded-full text-xs font-bold transition-all bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.15)]">7 Hari</button>
            <button onclick="updateData('30d')" class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all bg-surface border border-zinc-800 text-zinc-400 hover:text-white">30 Hari</button>
            <button onclick="updateData('90d')" class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all bg-surface border border-zinc-800 text-zinc-400 hover:text-white">90 Hari</button>
            <button onclick="updateData('1y')" class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all bg-surface border border-zinc-800 text-zinc-400 hover:text-white">1 Tahun</button>
        </div>

        <!-- Chart Section -->
        <div class="glass-card rounded-3xl p-5 mb-4 relative overflow-hidden">
            <h3 class="text-zinc-500 text-xs font-semibold uppercase tracking-wider mb-4 flex justify-between items-center">
                <span>Cumulative PNL (%)</span>
                <span id="loadingIndicator" class="hidden"><svg class="animate-spin h-3 w-3 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></span>
            </h3>
            <div class="w-full h-[220px]">
                <canvas id="pnlChart"></canvas>
            </div>
        </div>

        <!-- Win / Lose Stats -->
        <div class="flex justify-center gap-12 mb-8 px-4">
            <div class="text-center">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-1">Total Wins</p>
                <p class="text-2xl font-black text-white" id="valWins">-</p>
            </div>
            <div class="w-px bg-zinc-800"></div>
            <div class="text-center">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-1">Total Losses</p>
                <p class="text-2xl font-black text-zinc-500" id="valLosses">-</p>
            </div>
        </div>

        <!-- 3 Highlight Cards -->
        <div class="grid grid-cols-3 gap-3 mb-10">
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                <span class="text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1.5">Total Sinyal</span>
                <span class="text-xl font-bold text-white" id="valTotal">-</span>
            </div>
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                <span class="text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1.5">Win Rate</span>
                <span class="text-xl font-bold text-white" id="valWinrate">-</span>
            </div>
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center text-center bg-zinc-900 border-zinc-700">
                <span class="text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-1.5">Total PNL</span>
                <span class="text-xl font-black text-white" id="valTotalPnl">-</span>
            </div>
        </div>

        <!-- Signal History -->
        <div>
            <h2 class="text-lg font-bold text-white mb-4">
                Riwayat Sinyal
            </h2>
            
            <div class="space-y-3" id="historyList">
                <div class="text-center py-10 text-zinc-500 font-bold text-sm animate-pulse">
                    Memuat data dari Database...
                </div>
            </div>
            
            <!-- Container Tombol Lihat Lebih Banyak -->
            <div id="seeMoreContainer" class="mt-4 hidden">
                <button onclick="showAllHistory()" class="w-full py-3 rounded-xl border border-zinc-800 text-zinc-400 text-sm font-bold hover:bg-zinc-800 hover:text-white transition-all">
                    Lihat Lebih Banyak
                </button>
            </div>
        </div>

    </div>

    <script>
        // Set Font Global Chart.js
        Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
        Chart.defaults.color = '#71717a'; 

        // URL API GOOGLE SPREADSHEET (Sama dengan input.html)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9ABsd_BDOLnbzDfehd7EVa3Uov77DXSsg8E4S28ihD2dFHlly7hzOFSXXdO2LLhj9/exec";

        let pnlChart;
        let realData = [];
        let db = {
            '7d': { chartLabels: [], chartData: [], history: [], wins:0, losses:0, total:0, winrate:'0%', totalPnl:'0%' },
            '30d': { chartLabels: [], chartData: [], history: [], wins:0, losses:0, total:0, winrate:'0%', totalPnl:'0%' },
            '90d': { chartLabels: [], chartData: [], history: [], wins:0, losses:0, total:0, winrate:'0%', totalPnl:'0%' },
            '1y': { chartLabels: [], chartData: [], history: [], wins:0, losses:0, total:0, winrate:'0%', totalPnl:'0%' }
        };

        // ==========================================
        // INIT CHART.JS
        // ==========================================
        function initChart() {
            const ctx = document.getElementById('pnlChart').getContext('2d');
            let gradient = ctx.createLinearGradient(0, 0, 0, 250);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.15)'); 
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            pnlChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'PNL (%)',
                        data: [],
                        borderColor: '#ffffff',
                        backgroundColor: gradient,
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.4, 
                        pointRadius: 0, 
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#000000',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#171717',
                            titleColor: '#a1a1aa',
                            bodyColor: '#ffffff',
                            bodyFont: { weight: 'bold' },
                            borderColor: '#27272a',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function(context) { return context.raw + '%'; }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false, drawBorder: false }, ticks: { font: { size: 10 }, color: '#71717a' } },
                        y: {
                            grid: { color: 'rgba(63, 63, 70, 0.2)', borderDash: [5, 5], drawBorder: false },
                            ticks: { font: { size: 10 }, color: '#71717a', callback: function(value) { return value + '%'; } }
                        }
                    }
                }
            });
        }

        // ==========================================
        // LOGIKA PENARIKAN & PEMROSESAN DATA
        // ==========================================
        
        // Pemetaan Bulan ke Angka JS (0-11)
        const idMonths = {
            'jan':0, 'januari':0, 'feb':1, 'februari':1, 'mar':2, 'maret':2, 'apr':3, 'april':3, 'mei':4, 'jun':5, 'juni':5,
            'jul':6, 'juli':6, 'agu':7, 'agustus':7, 'sep':8, 'september':8, 'okt':9, 'oktober':9, 'nov':10, 'november':10, 'des':11, 'desember':11
        };
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

        function parseDateCustom(dateStr) {
            if (!dateStr) return new Date();
            const parts = dateStr.toLowerCase().trim().split(' ');
            if (parts.length >= 2) {
                const day = parseInt(parts[0], 10);
                const monthStr = parts[1];
                const month = idMonths[monthStr] !== undefined ? idMonths[monthStr] : new Date().getMonth();
                let year = new Date().getFullYear();
                
                let parsed = new Date(year, month, day);
                // Jika tanggal seolah "di masa depan" (lebih dari 1 bulan dari sekarang), artinya data tersebut berasal dari tahun lalu.
                if (parsed > new Date(new Date().getTime() + 30 * 24 * 60 * 60 * 1000)) {
                    parsed.setFullYear(year - 1);
                }
                return parsed;
            }
            return new Date();
        }

        function parsePnlFloat(pnlStr) {
            if (!pnlStr || pnlStr === '-' || pnlStr.trim() === '') return 0;
            const val = parseFloat(pnlStr.replace(/[^\d.-]/g, ''));
            return isNaN(val) ? 0 : val;
        }

        async function fetchRealData() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                const json = await response.json();
                
                // Tambahkan parsed helper
                realData = (json.data || []).map(item => {
                    return {
                        ...item,
                        parsedDate: parseDateCustom(item.date),
                        parsedPnl: parsePnlFloat(item.pnl)
                    };
                });
                
                buildDbStats();
                updateData('7d'); // Tampilkan secara default

            } catch (error) {
                console.error("Fetch Error: ", error);
                document.getElementById('historyList').innerHTML = `<div class="text-center py-10 text-red-500 font-bold text-sm">Gagal memuat Database. Pastikan internet stabil.</div>`;
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        function buildDbStats() {
            const periods = { '7d': 7, '30d': 30, '90d': 90, '1y': 365 };
            const now = new Date();

            for (let key in periods) {
                const daysLimit = periods[key];
                const cutoffDate = new Date(now.getTime() - (daysLimit * 24 * 60 * 60 * 1000));
                
                // 1. Filter Data Berdasarkan Tanggal
                let filtered = realData.filter(item => item.parsedDate >= cutoffDate);
                
                // 2. Sort untuk History List (Dari Terbaru ke Terlama)
                filtered.sort((a, b) => b.parsedDate - a.parsedDate);

                // 3. Hitung Metrik Statistik
                let wins = 0, losses = 0, totalPnlNum = 0;
                filtered.forEach(item => {
                    if (item.status === 'WIN') wins++;
                    if (item.status === 'LOSS') losses++;
                    totalPnlNum += item.parsedPnl;
                });

                let total = filtered.length;
                let winrate = (wins + losses) > 0 ? ((wins / (wins + losses)) * 100).toFixed(1) + '%' : '0%';
                
                // 4. Proses Data untuk Chart (Kumulatif Harian)
                // Sort array (Dari Terlama ke Terbaru) khusus untuk Chart
                let chartDataArr = [...filtered].sort((a, b) => a.parsedDate - b.parsedDate);
                
                let dailyPnlMap = new Map();
                chartDataArr.forEach(item => {
                    // Hanya masukan PNL dari posisi yang tidak CANCEL/RUNNING saja ke chart jika anda mau. 
                    // (Disini semua dijumlahkan sesuai nilai pnl kolom)
                    let dayFormat = String(item.parsedDate.getDate()).padStart(2, '0');
                    let monthFormat = monthNames[item.parsedDate.getMonth()];
                    let dateKey = `${dayFormat} ${monthFormat}`;

                    if (!dailyPnlMap.has(dateKey)) dailyPnlMap.set(dateKey, 0);
                    dailyPnlMap.set(dateKey, dailyPnlMap.get(dateKey) + item.parsedPnl);
                });

                let chartLabels = [];
                let chartDataValues = [];
                let cumPnl = 0;

                if (dailyPnlMap.size === 0) {
                    chartLabels = ['Tidak ada data'];
                    chartDataValues = [0];
                } else {
                    dailyPnlMap.forEach((dailyPnl, dateLabel) => {
                        chartLabels.push(dateLabel);
                        cumPnl += dailyPnl;
                        chartDataValues.push(parseFloat(cumPnl.toFixed(2)));
                    });
                }

                // 5. Simpan Hasil ke DB Object per filter
                db[key] = {
                    chartLabels: chartLabels,
                    chartData: chartDataValues,
                    wins: wins,
                    losses: losses,
                    total: total,
                    winrate: winrate,
                    totalPnl: (totalPnlNum > 0 ? '+' : '') + parseFloat(totalPnlNum.toFixed(2)) + '%',
                    history: filtered
                };
            }
        }

        // ==========================================
        // UI UPDATER LOGIC
        // ==========================================
        let currentPeriod = '7d';

        function updateData(period) {
            currentPeriod = period;
            const data = db[period];

            // UI Tombol Aktif
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-white', 'text-black', 'shadow-[0_0_15px_rgba(255,255,255,0.15)]');
                btn.classList.add('bg-surface', 'border', 'border-zinc-800', 'text-zinc-400');
            });
            const clickedBtn = event ? event.currentTarget : document.querySelector(`.filter-btn[onclick="updateData('${period}')"]`);
            if(clickedBtn && clickedBtn.classList) {
                clickedBtn.classList.remove('bg-surface', 'border', 'border-zinc-800', 'text-zinc-400');
                clickedBtn.classList.add('bg-white', 'text-black', 'shadow-[0_0_15px_rgba(255,255,255,0.15)]');
            }

            // Update Chart
            pnlChart.data.labels = data.chartLabels;
            pnlChart.data.datasets[0].data = data.chartData;
            pnlChart.update();

            // Update Text Stats
            updateElementText('valWins', data.wins);
            updateElementText('valLosses', data.losses);
            updateElementText('valTotal', data.total);
            updateElementText('valWinrate', data.winrate);
            
            const pnlEl = document.getElementById('valTotalPnl');
            pnlEl.innerText = data.totalPnl;
            pnlEl.className = `text-xl font-black ${data.totalPnl.includes('-') ? 'text-zinc-500' : 'text-white'}`;

            // Render list history
            renderHistory(data.history, false);
        }

        function updateElementText(id, value) {
            const el = document.getElementById(id);
            el.style.opacity = 0;
            setTimeout(() => {
                el.innerText = value;
                el.style.opacity = 1;
                el.style.transition = "opacity 0.3s ease";
            }, 150);
        }

        function showAllHistory() {
            renderHistory(db[currentPeriod].history, true);
        }

        function renderHistory(historyData, showAll = false) {
            const listContainer = document.getElementById('historyList');
            const seeMoreBtn = document.getElementById('seeMoreContainer');
            listContainer.innerHTML = '';

            if (historyData.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-10 text-zinc-500 font-bold text-sm border border-zinc-800 rounded-2xl border-dashed">Belum ada sinyal di periode ini.</div>`;
                seeMoreBtn.classList.add('hidden');
                return;
            }

            const itemsToShow = showAll ? historyData : historyData.slice(0, 5);

            itemsToShow.forEach(item => {
                let typeColors = 'bg-zinc-900 text-zinc-300 border border-zinc-800';
                if(item.type && item.type.includes('LONG')) typeColors = 'bg-white text-black border border-white font-extrabold';
                if(item.type && item.type.includes('SHORT')) typeColors = 'bg-transparent text-zinc-400 border border-zinc-600';

                // Gunakan Kolom Risk Jika Ada (Fallback Kalkulasi dari Leverage Jika Kosong)
                let riskLabel = item.risk || 'Low Risk';
                let riskColor = 'text-zinc-400';
                if(riskLabel.toLowerCase().includes('medium')) riskColor = 'text-zinc-300';
                else if(riskLabel.toLowerCase().includes('high')) riskColor = 'text-white font-bold';

                let statusColor = 'text-zinc-500';
                let statusDot = 'bg-zinc-600';
                let pulseClass = '';

                if(item.status === 'WIN') { statusColor = 'text-white'; statusDot = 'bg-white'; }
                if(item.status === 'LOSS') { statusColor = 'text-zinc-600'; statusDot = 'bg-zinc-600'; }
                if(item.status === 'BEP') { statusColor = 'text-zinc-400'; statusDot = 'bg-zinc-400'; }
                if(item.status === 'CANCEL') { statusColor = 'text-zinc-500'; statusDot = 'bg-transparent border border-zinc-500'; }
                if(item.status === 'RUNNING') { 
                    statusColor = 'text-white'; 
                    statusDot = 'bg-white'; 
                    pulseClass = 'animate-pulse shadow-[0_0_8px_rgba(255,255,255,0.8)]'; 
                }

                let pnlString = String(item.pnl);
                let pnlTextColor = 'text-zinc-500';
                if (pnlString.includes('+')) pnlTextColor = 'text-white';

                const html = `
                <div class="glass-card rounded-2xl p-4 flex items-center justify-between hover:bg-zinc-900 transition-all">
                    <div class="flex flex-col gap-1 w-1/3">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-white">${item.pair}</span>
                            <span class="text-[10px] bg-zinc-800 text-zinc-300 px-1.5 py-0.2 rounded font-semibold">${item.leverage}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${typeColors}">${item.type}</span>
                            <span class="text-[8px] ${riskColor}">• ${riskLabel}</span>
                        </div>
                    </div>
                    
                    <div class="w-1/3 flex justify-center">
                        <div class="flex items-center gap-1.5 bg-surface px-2.5 py-1 rounded-full border border-zinc-800">
                            <span class="w-1.5 h-1.5 rounded-full ${statusDot} ${pulseClass}"></span>
                            <span class="text-[9px] font-bold ${statusColor} uppercase tracking-wider">${item.status}</span>
                        </div>
                    </div>

                    <div class="flex flex-col items-end gap-1 w-1/3">
                        <span class="text-sm font-black ${pnlTextColor}">${pnlString}</span>
                        <span class="text-[10px] text-zinc-500 font-medium">${item.date}</span>
                    </div>
                </div>`;
                listContainer.insertAdjacentHTML('beforeend', html);
            });

            if (!showAll && historyData.length > 5) {
                seeMoreBtn.classList.remove('hidden');
            } else {
                seeMoreBtn.classList.add('hidden');
            }
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            initChart();
            fetchRealData(); // Ambil Data Asli dari Backend Spreadsheet
        });

    </script>
</body>
</html>
