<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNR TRADE - Progress Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        base: '#000000',     /* Pure Black */
                        surface: '#0a0a0a',  /* Very dark gray */
                        surfaceHover: '#171717', 
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        /* Hide scrollbar completely but allow scroll */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glass effect monokrom */
        .glass-card {
            background: linear-gradient(145deg, rgba(20,20,20,0.8) 0%, rgba(10,10,10,0.4) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body class="min-h-screen pb-16 pt-8">

    <div class="max-w-2xl mx-auto px-5">
        
        <!-- Headline Section -->
        <div class="mb-8 text-center sm:text-left">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface border border-zinc-800 text-xs font-semibold text-zinc-400 mb-4">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                LIVE DATABASE AKTIF
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2 text-white">
                Progres Call SNR Trade
            </h1>
            <p class="text-zinc-500 text-sm">Pantau terus hasil setup, win rate, dan pertumbuhan portofolio secara transparan.</p>
        </div>

        <!-- Time Filters -->
        <div class="flex justify-center gap-2 overflow-x-auto pb-2 mb-6 hide-scrollbar" id="timeFilters">
            <button onclick="updateData('7d', this)" class="filter-btn active px-5 py-2 rounded-full text-xs font-bold transition-all bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.15)] pointer-events-none opacity-50" id="btn7d">7 Hari</button>
            <button onclick="updateData('30d', this)" class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all bg-surface border border-zinc-800 text-zinc-400 hover:text-white pointer-events-none opacity-50" id="btn30d">30 Hari</button>
            <button onclick="updateData('90d', this)" class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all bg-surface border border-zinc-800 text-zinc-400 hover:text-white pointer-events-none opacity-50" id="btn90d">90 Hari</button>
            <button onclick="updateData('1y', this)" class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all bg-surface border border-zinc-800 text-zinc-400 hover:text-white pointer-events-none opacity-50" id="btn1y">1 Tahun</button>
        </div>

        <!-- Chart Section -->
        <div class="glass-card rounded-3xl p-5 mb-4 relative overflow-hidden">
            <h3 class="text-zinc-500 text-xs font-semibold uppercase tracking-wider mb-4">Cumulative PNL (%)</h3>
            <div class="w-full h-[220px]">
                <canvas id="pnlChart"></canvas>
            </div>
        </div>

        <!-- Win / Lose Stats -->
        <div class="flex justify-center gap-12 mb-8 px-4">
            <div class="text-center">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-1">Total Wins</p>
                <p class="text-2xl font-black text-white" id="valWins">-</p>
            </div>
            <div class="w-px bg-zinc-800"></div>
            <div class="text-center">
                <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mb-1">Total Losses</p>
                <p class="text-2xl font-black text-zinc-500" id="valLosses">-</p>
            </div>
        </div>

        <!-- 3 Highlight Cards -->
        <div class="grid grid-cols-3 gap-3 mb-10">
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                <span class="text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1.5">Total Sinyal</span>
                <span class="text-xl font-bold text-white" id="valTotal">-</span>
            </div>
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                <span class="text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1.5">Win Rate</span>
                <span class="text-xl font-bold text-white" id="valWinrate">-</span>
            </div>
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center text-center bg-zinc-900 border-zinc-700">
                <span class="text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-1.5">Total PNL</span>
                <span class="text-xl font-black text-white" id="valTotalPnl">-</span>
            </div>
        </div>

        <!-- Signal History -->
        <div>
            <h2 class="text-lg font-bold text-white mb-4">
                Riwayat Sinyal
            </h2>
            
            <div class="space-y-3" id="historyList">
                <!-- Data List (Dibuat lewat JS) -->
                <div class="text-center py-10 text-zinc-500 font-bold text-sm animate-pulse">
                    Memuat data dari Database...
                </div>
            </div>
            <!-- Container Tombol Lihat Lebih Banyak -->
            <div id="seeMoreContainer" class="mt-4 hidden">
                <button onclick="showAllHistory()" class="w-full py-3 rounded-xl border border-zinc-800 text-zinc-400 text-sm font-bold hover:bg-zinc-800 hover:text-white transition-all">
                    Lihat Lebih Banyak
                </button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6IiihaJF6K1kU-gKao2Vm2ooUxUxDOI5-sTiemE1JPYwSNeyU2qpkCepUTu_Ca_yMlw/exec";

        // Variabel Database Dinamis (menggantikan dummy db)
        let db = { '7d': null, '30d': null, '90d': null, '1y': null };
        let rawDatabase = [];

        // Set Font Global Chart.js
        Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
        Chart.defaults.color = '#71717a'; 

        const ctx = document.getElementById('pnlChart').getContext('2d');
        let gradient = ctx.createLinearGradient(0, 0, 0, 250);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.15)'); 
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

        let pnlChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'PNL (%)', data: [], borderColor: '#ffffff', backgroundColor: gradient, borderWidth: 2.5, fill: true, tension: 0.4, pointRadius: 0, pointHoverRadius: 6, pointBackgroundColor: '#000000', pointBorderColor: '#ffffff', pointBorderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#171717', titleColor: '#a1a1aa', bodyColor: '#ffffff', bodyFont: { weight: 'bold' }, borderColor: '#27272a', borderWidth: 1, padding: 10, displayColors: false, callbacks: { label: function(context) { return context.raw + '%'; } } } }, scales: { x: { grid: { display: false, drawBorder: false }, ticks: { font: { size: 10 }, color: '#71717a' } }, y: { grid: { color: 'rgba(63, 63, 70, 0.2)', borderDash: [5, 5], drawBorder: false }, ticks: { font: { size: 10 }, color: '#71717a', callback: function(value) { return value + '%'; } } } }
        });

        // ==========================================
        // LOGIKA PENARIKAN DATA (FETCH API)
        // ==========================================
        const indoMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

        // Helper ubah "09 Agu" menjadi Data Waktu Javascript yg asli
        function parseIndoDate(dateStr) {
            if (!dateStr) return new Date();
            const parts = String(dateStr).trim().split(' ');
            const day = parseInt(parts[0]);
            const monthIndex = indoMonths.indexOf(parts[1]);
            const year = new Date().getFullYear();
            return new Date(year, monthIndex, day);
        }

        async function loadDataFromSheets() {
            try {
                const response = await fetch(SCRIPT_URL);
                const json = await response.json();
                
                // Ambil data, filter baris yg kosong, lalu dibalik (terbaru di atas)
                rawDatabase = json.data.filter(row => row.pair).reverse();

                // Proses data otomatis membagi ke 4 waktu
                db['7d'] = generateStats(7);
                db['30d'] = generateStats(30);
                db['90d'] = generateStats(90);
                db['1y'] = generateStats(365);

                // Buka kunci tombol filter
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('pointer-events-none', 'opacity-50');
                });

                // Tampilkan data 7 Hari sebagai awalan
                updateData('7d');

            } catch (error) {
                console.error(error);
                document.getElementById('historyList').innerHTML = `<div class="text-center py-10 text-red-500 font-bold text-sm">Gagal memuat Database.<br>Pastikan URL API benar & internet stabil.</div>`;
            }
        }

        // ==========================================
        // MESIN PENGHITUNG STATISTIK & GRAFIK (AUTO)
        // ==========================================
        function generateStats(daysAgo) {
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysAgo);
            cutoffDate.setHours(0,0,0,0);

            let wins = 0, losses = 0, totalPnlSum = 0;
            let chartMap = {};
            let chartLabels = [];
            let historyList = [];

            // Siapkan label sumbu X untuk Grafik (Urut dari hari tertua ke hari ini)
            for(let i = daysAgo - 1; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let label = `${String(d.getDate()).padStart(2, '0')} ${indoMonths[d.getMonth()]}`;
                chartLabels.push(label);
                chartMap[label] = 0; // Set PNL awal ke 0 di tanggal itu
            }

            // Saring data berdasarkan tanggal yg masuk range
            let filteredRows = rawDatabase.filter(row => parseIndoDate(row.date) >= cutoffDate);

            filteredRows.forEach(row => {
                if (row.status === 'WIN') wins++;
                if (row.status === 'LOSS') losses++;
                
                // Bersihkan string angka (contoh: "+25.5%" -> 25.5)
                let pnlStr = String(row.pnl || "0").replace('%', '').replace('+', '').trim();
                let pnlVal = parseFloat(pnlStr) || 0;

                // Hitung kumulatif chart HANYA untuk status WIN, LOSS, BEP
                if (row.status === 'WIN' || row.status === 'LOSS' || row.status === 'BEP') {
                    totalPnlSum += pnlVal;
                    if (chartMap[row.date] !== undefined) {
                        chartMap[row.date] += pnlVal;
                    }
                }

                // Format rapi untuk ditampilkan di riwayat
                let finalPnl = String(row.pnl);
                if (pnlVal > 0 && !finalPnl.includes('+')) finalPnl = '+' + finalPnl;
                if (!finalPnl.includes('%') && finalPnl !== '-') finalPnl += '%';
                
                let finalLeverage = String(row.leverage);
                if (!finalLeverage.includes('x')) finalLeverage += 'x';

                historyList.push({
                    pair: row.pair,
                    type: row.type,
                    leverage: finalLeverage,
                    status: row.status,
                    pnl: finalPnl,
                    date: row.date
                });
            });

            // Bangun Array untuk Grafik
            let chartData = [];
            let cumSum = 0;
            for (let label of chartLabels) {
                cumSum += chartMap[label];
                chartData.push(parseFloat(cumSum.toFixed(2))); // Pembulatan rapi 2 desimal
            }

            // Hitung Win Rate
            let winrate = (wins + losses) === 0 ? "0.0%" : ((wins / (wins + losses)) * 100).toFixed(1) + "%";
            let totalPnlFormatted = (totalPnlSum > 0 ? "+" : "") + parseFloat(totalPnlSum.toFixed(2)) + "%";

            return {
                chartLabels: chartLabels,
                chartData: chartData,
                wins: wins,
                losses: losses,
                total: filteredRows.length,
                winrate: winrate,
                totalPnl: totalPnlFormatted,
                history: historyList
            };
        }

        // ==========================================
        // RENDER TAMPILAN KE LAYAR
        // ==========================================
        let currentPeriod = '7d';

        function updateData(period, btnElement = null) {
            if(!db[period]) return; // Cegah error jika dipencet sebelum loading selesai
            
            currentPeriod = period;
            const data = db[period];

            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.className = "filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all bg-surface border border-zinc-800 text-zinc-400 hover:text-white";
            });

            const clickedBtn = btnElement || document.querySelector(`.filter-btn[onclick*="${period}"]`);
            if(clickedBtn) {
                clickedBtn.className = "filter-btn active px-5 py-2 rounded-full text-xs font-bold transition-all bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.15)]";
            }

            // Update Chart
            pnlChart.data.labels = data.chartLabels;
            pnlChart.data.datasets[0].data = data.chartData;
            pnlChart.update();

            // Update Text
            updateElementText('valWins', data.wins);
            updateElementText('valLosses', data.losses);
            updateElementText('valTotal', data.total);
            updateElementText('valWinrate', data.winrate);
            
            const pnlEl = document.getElementById('valTotalPnl');
            pnlEl.innerText = data.totalPnl;
            pnlEl.className = `text-xl font-black ${data.totalPnl.includes('-') ? 'text-zinc-500' : 'text-white'}`;

            // Render History
            renderHistory(data.history, false);
        }

        function updateElementText(id, value) {
            const el = document.getElementById(id);
            el.style.opacity = 0;
            setTimeout(() => {
                el.innerText = value;
                el.style.opacity = 1;
                el.style.transition = "opacity 0.3s ease";
            }, 150);
        }

        function showAllHistory() {
            renderHistory(db[currentPeriod].history, true);
        }

        function renderHistory(historyData, showAll = false) {
            const listContainer = document.getElementById('historyList');
            const seeMoreBtn = document.getElementById('seeMoreContainer');
            listContainer.innerHTML = '';

            if (historyData.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-6 text-zinc-500 font-bold text-xs">Belum ada sinyal di rentang waktu ini.</div>`;
                seeMoreBtn.classList.add('hidden');
                return;
            }

            const itemsToShow = showAll ? historyData : historyData.slice(0, 5);

            itemsToShow.forEach(item => {
                let typeColors = 'bg-zinc-900 text-zinc-300 border border-zinc-800';
                if(item.type.includes('LONG')) typeColors = 'bg-white text-black border border-white font-extrabold';
                if(item.type.includes('SHORT')) typeColors = 'bg-transparent text-zinc-400 border border-zinc-600';

                let levVal = parseInt(item.leverage) || 1;
                let riskLabel = 'Low Risk';
                let riskColor = 'text-zinc-400';
                if(levVal >= 10 && levVal <= 25) { riskLabel = 'Med Risk'; riskColor = 'text-zinc-300'; } 
                else if(levVal > 25) { riskLabel = 'High Risk'; riskColor = 'text-white font-bold'; }

                let statusColor = 'text-zinc-500';
                let statusDot = 'bg-zinc-600';
                let pulseClass = '';

                if(item.status === 'WIN') { statusColor = 'text-white'; statusDot = 'bg-white'; }
                if(item.status === 'LOSS') { statusColor = 'text-zinc-600'; statusDot = 'bg-zinc-600'; }
                if(item.status === 'BEP') { statusColor = 'text-zinc-400'; statusDot = 'bg-zinc-400'; }
                if(item.status === 'CANCEL') { statusColor = 'text-zinc-500'; statusDot = 'bg-transparent border border-zinc-500'; }
                if(item.status === 'RUNNING') { 
                    statusColor = 'text-white'; statusDot = 'bg-white'; 
                    pulseClass = 'animate-pulse shadow-[0_0_8px_rgba(255,255,255,0.8)]'; 
                }

                let pnlTextColor = 'text-zinc-500';
                if (item.pnl.includes('+')) pnlTextColor = 'text-white';

                const html = `
                <div class="glass-card rounded-2xl p-4 flex items-center justify-between hover:bg-zinc-900 transition-all">
                    <div class="flex flex-col gap-1 w-1/3">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-white">${item.pair}</span>
                            <span class="text-[10px] bg-zinc-800 text-zinc-300 px-1.5 py-0.2 rounded font-semibold">${item.leverage}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${typeColors}">${item.type}</span>
                            <span class="text-[8px] ${riskColor}">• ${riskLabel}</span>
                        </div>
                    </div>
                    
                    <div class="w-1/3 flex justify-center">
                        <div class="flex items-center gap-1.5 bg-surface px-2.5 py-1 rounded-full border border-zinc-800">
                            <span class="w-1.5 h-1.5 rounded-full ${statusDot} ${pulseClass}"></span>
                            <span class="text-[9px] font-bold ${statusColor} uppercase tracking-wider">${item.status}</span>
                        </div>
                    </div>

                    <div class="flex flex-col items-end gap-1 w-1/3">
                        <span class="text-sm font-black ${pnlTextColor}">${item.pnl}</span>
                        <span class="text-[10px] text-zinc-500 font-medium">${item.date}</span>
                    </div>
                </div>`;
                listContainer.insertAdjacentHTML('beforeend', html);
            });

            if (!showAll && historyData.length > 5) {
                seeMoreBtn.classList.remove('hidden');
            } else {
                seeMoreBtn.classList.add('hidden');
            }
        }

        function hideChartTooltip(event) {
            const chartCanvas = document.getElementById('pnlChart');
            if (event.target !== chartCanvas) {
                pnlChart.setActiveElements([]);
                pnlChart.tooltip.setActiveElements([], {x: 0, y: 0});
                pnlChart.update();
            }
        }
        document.addEventListener('touchstart', hideChartTooltip);
        document.addEventListener('mousedown', hideChartTooltip);

        // MULAI JALANKAN SAAT WEB DIBUKA
        window.addEventListener('DOMContentLoaded', loadDataFromSheets);

    </script>
</body>
</html>
